[package]
name = "beats-front"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
beats-core = { path = "../beats-core" }
dotenvy = "0.15.7"
http = "1.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }

