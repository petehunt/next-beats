[package]
name = "next-beats-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["crates/beats-core", "crates/beats-front", "crates/beats-node"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[dependencies]
beats-core = { path = "crates/beats-core" }
http-body-util = "0.1.3"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
vercel_runtime = "2.4.0"

[[bin]]
name = "rust-play"
path = "api/rust-play.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
